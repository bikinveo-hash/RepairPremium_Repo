name: Build

on:
  push:
    branches: [master, main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      full_check:
        description: Run full Moviebox regression tests
        type: boolean
        default: false
      rebuild_all:
        description: Rebuild all plugins instead of changed plugins
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Checkout published plugins
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build changed plugins
        working-directory: src
        env:
          REBUILD_ALL: ${{ inputs.rebuild_all || false }}
        run: python3 Moviebox/tests/distribution.py build "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/release.json"

      - name: Full regression checks
        if: ${{ inputs.full_check == true }}
        working-directory: src
        run: |
          python3 Moviebox/tests/verify_migration.py
          python3 Moviebox/tests/run_regression.py
          python3 -m unittest discover -s Moviebox/tests/diagnostics -p 'test_*.py'

      - name: Check and stage packages
        working-directory: src
        run: |
          python3 -m unittest discover -s Moviebox/tests -p 'test_distribution.py'
          python3 Moviebox/tests/distribution.py prepare "$GITHUB_WORKSPACE/builds" "$RUNNER_TEMP/release.json"

      - name: Publish plugins
        working-directory: builds
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No plugin updates."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:refs/heads/builds
